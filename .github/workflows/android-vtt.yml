name: android-vtt

# Portfolio fork CI: every push to android-vtt runs the JVM tests, builds the
# debug APK, and rolls it into one prerelease so the latest commit is always
# installable. No signing keys involved; the APK is debug-signed by Gradle.
# Upstreaming this file needs Dax's review (.github is release-boundary).

on:
  push:
    branches: [android-vtt]
    paths:
      - "android/**"
      - ".github/workflows/android-vtt.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-vtt
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Android SDK packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/ndk
            ${{ env.ANDROID_SDK_ROOT }}/cmake
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/36.0.0
            ${{ env.ANDROID_SDK_ROOT }}/platforms/android-36
          key: android-sdk-${{ runner.os }}-36-ndk27-cmake3221
      - name: Install Android packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/app/build.gradle.kts', 'android/settings.gradle.kts') }}
      - name: Unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew test
      - name: Debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug
      - name: Stage APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk hex-android-vtt.apk
          sha256sum hex-android-vtt.apk | tee hex-android-vtt.sha256
      - name: Rolling release (Latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Full release (not prerelease) so GitHub highlights it as Latest.
          gh release delete android-vtt-latest --cleanup-tag -y || true
          gh release create android-vtt-latest hex-android-vtt.apk hex-android-vtt.sha256 \
            --title "Hex for Android — latest (${GITHUB_SHA::12})" \
            --notes "Debug-signed APK from ${GITHUB_SHA}. Offline voice keyboard: hold the Hex key, speak, release to insert. Built by the android-vtt workflow."
