name: android-vtt

# Portfolio fork CI: every push to android-vtt runs the JVM tests, builds the
# debug APK, and rolls it into one prerelease so the latest commit is always
# installable. No signing keys involved; the APK is debug-signed by Gradle.
# Upstreaming this file needs Dax's review (.github is release-boundary).

on:
  push:
    branches: [android-vtt]
    paths:
      - "android/**"
      - ".github/workflows/android-vtt.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-vtt
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/app/build.gradle.kts', 'android/settings.gradle.kts') }}
      - name: Unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew test
      - name: Debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug
      - name: Stage APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk hex-android-vtt.apk
          sha256sum hex-android-vtt.apk | tee hex-android-vtt.sha256
      - name: Rolling prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete android-vtt-latest --cleanup-tag -y || true
          gh release create android-vtt-latest hex-android-vtt.apk hex-android-vtt.sha256 \
            --prerelease --title "Android VTT latest (${GITHUB_SHA::12})" \
            --notes "Debug-signed APK from ${GITHUB_SHA}. Built by android-vtt workflow."
