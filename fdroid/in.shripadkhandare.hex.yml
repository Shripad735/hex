# Display metadata (title/summary/description/screenshots/changelogs) is taken
# from fastlane/metadata/android/en-US/ in the source repo. Do not duplicate
# Name/Summary/Description here.

RepoType: git
Repo: https://github.com/Shripad735/hex

Builds:
  - versionName: 0.1.1
    versionCode: 2
    # IMPORTANT: replace with the tagged commit you publish, e.g. android-v1.0.0.
    # Never use a branch name. Full commit hash required.
    # Current android-vtt head at time of drafting:
    commit: 0d884e26ec0ebe5ac543e6d4d04eca59d62c5ead
    subdir: android
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    # prebuild runs in subdir (android/). HEX_SKIP_MODEL_DOWNLOAD=1 avoids the
    # build-time HuggingFace fetch; the tiny model must then be pre-seeded.
    # Option A (reproducible, preferred by reviewers): vendor whisper.cpp via
    # srclib and export HEX_WHISPER_SRC=$$WhisperCpp$$, and pre-seed
    # whisper-tiny.bin with SHA256 818710568da3ca15689e31a743197b520007872ff9576237bda97bd1b469c3d7.
    # Option B (local test only): allow network and build normally.
    prebuild:
      - export HEX_SKIP_MODEL_DOWNLOAD=1
      - export HEX_WHISPER_SRC=$$WhisperCpp$$

MaintainerNotes: |-
  Fork of anomalyco/hex (desktop dictation). New applicationId in.shripadkhandare.hex.
  Runtime model download (190 MB Whisper small, MIT, HuggingFace) is opt-in via
  Get started / Download button with size + SHA-256 verify; tiny model is bundled.
  Daily silent GitHub update check kept per upstream choice; flag if Tracking
  AntiFeature needed. No GMS/Firebase. NDK 27.2.12479018, CMake 3.22.1, compileSdk 36.

AutoUpdateMode: Version %v
UpdateCheckMode: Tags
UpdateCheckData: app/build.gradle.kts|versionCode\s(\d+)|.|versionName\s"([^"]+)"
