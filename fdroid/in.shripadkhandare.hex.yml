# Display metadata (title/summary/description/screenshots/changelogs) is taken
# from fastlane/metadata/android/en-US/ in the source repo. Do not duplicate
# Name/Summary/Description here.

RepoType: git
Repo: https://github.com/Shripad735/hex

Builds:
  - versionName: 0.1.1
    versionCode: 2
    # Release tag android-v0.1.1 (versionCode 2). Never use a branch name.
    # Full commit hash required.
    commit: ab8325f94db9fa3ab04b5fec0ab7ce44a7d8ffdf
    subdir: android
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    # No prebuild overrides: the build fetches whisper.cpp (pinned tarball +
    # SHA-256 in CMakeLists) and the tiny model (pinned URL + SHA-256 in
    # build.gradle) over the network like Gradle/Maven deps. If reviewers
    # require vendored sources, the code supports HEX_WHISPER_SRC (pre-fetched
    # whisper.cpp tree) and HEX_SKIP_MODEL_DOWNLOAD=1 (pre-seeded
    # whisper-tiny.bin) without changes.

MaintainerNotes: |-
  Fork of anomalyco/hex (desktop dictation). New applicationId in.shripadkhandare.hex.
  Runtime model download (190 MB Whisper small, MIT, HuggingFace) is opt-in via
  Get started / Download button with size + SHA-256 verify; tiny model is bundled.
  Daily silent GitHub update check kept per upstream choice; flag if Tracking
  AntiFeature needed. No GMS/Firebase. NDK 27.2.12479018, CMake 3.22.1, compileSdk 36.

AutoUpdateMode: Version %v
UpdateCheckMode: Tags
UpdateCheckData: app/build.gradle.kts|versionCode\s(\d+)|.|versionName\s"([^"]+)"
